[pytest]
# rootdir is backend/, so ".." puts the repo root on sys.path for `import backend.axelrod` and `import mock`.
pythonpath = ..
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: calls AWS (Bedrock, Guardrails, S3, DynamoDB). Skipped unless AXELROD_LIVE=1
